<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrivacyLens</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <h1>PrivacyLens</h1>
    <p>See → Understand → Decide → Forget.</p>
  </header>
  <main aria-live="polite" aria-busy="true" id="result">
    <h2 id="domain">Reading this tab…</h2>
    <p id="scheme"></p>
    <p id="status" class="status" hidden></p>
    <p id="summary"></p>
    <h2 class="section-title">URL findings</h2>
    <div id="findings"></div>
    <section aria-labelledby="permissions-heading">
      <h2 class="section-title" id="permissions-heading">Site permissions</h2>
      <p class="permission-context" id="permissions-context">Reading browser settings…</p>
      <div id="permission-notes"></div>
      <div id="site-permissions"></div>
    </section>
  </main>
  <nav aria-label="Extension audit">
    <a class="audit-link" href="../extensions/extensions.html" target="_blank" rel="noopener">Review browser extensions</a>
  </nav>
  <footer>
    <p>Local checks only. No browsing history saved.</p>
    <p>Closing this popup clears this scan. Reopen to check again.</p>
  </footer>
</body>
</html>
