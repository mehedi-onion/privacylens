<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrivacyLens — VirusTotal settings</title>
  <link rel="stylesheet" href="../ui/brand.css">
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <header><img class="brand-logo" src="../../assets/logo.png" alt="PrivacyLens" width="180" height="42"><h1>VirusTotal</h1><p class="context">Optional reputation checks</p></header>
  <main>
    <label for="vt-key">API key</label>
    <input id="vt-key" type="password" maxlength="256" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="key-privacy">
    <label class="remember"><input id="remember-key" type="checkbox"> Remember on this browser</label>
    <p class="context" id="key-privacy">Unchecked: kept only for this browser session.<br>Checked: stored locally in this browser profile, without sync.</p>
    <div class="controls"><button id="save-key" type="button">Save</button><button id="forget-key" type="button">Forget</button></div>
    <p id="key-status" role="status">Reading configuration…</p>
    <p class="context">Used only for a lookup you confirm. Saving sends no request.</p>
    <p><a href="../transparency/transparency.html#virustotal">How PrivacyLens uses this key</a></p>
  </main>
  <footer><a href="../transparency/transparency.html">About &amp; privacy</a></footer>
</body>
</html>
